name: Migu Sources Update

on:
  schedule:
    - cron: '0 */4 * * *'   # 每 4 小时
  workflow_dispatch:        # 可手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run migu_gen.py
        env:
          MIGU_USERNAME: ${{ secrets.MIGU_USERNAME }}
          MIGU_PASSWORD: ${{ secrets.MIGU_PASSWORD }}
        run: python3 .github/workflows/migu_gen.py

      - name: Commit and push migu/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migu/
          if git diff --cached --quiet; then
            echo "migu/ 无变化，跳过提交"
          else
            git commit -m "chore: 更新咪咕源 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
